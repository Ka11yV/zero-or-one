# A1 서버에서: cd deploy && cp .env.example .env (값 채우기) && docker compose up -d --build
name: zero-or-one

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env에 POSTGRES_PASSWORD를 넣으세요}
      POSTGRES_DB: zoo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoo -d zoo"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 외부에 포트를 열지 않는다 (API 서버만 내부망으로 접속)

  api:
    build: ../server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://zoo:${POSTGRES_PASSWORD}@db:5432/zoo
      HOST: 0.0.0.0
      PORT: "8787"
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      TRUST_PROXY: "1"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://${SITE_ADDRESS}}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?deploy/.env에 SITE_ADDRESS를 넣으세요}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
